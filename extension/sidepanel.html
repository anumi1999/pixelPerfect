<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pixel Perfect</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>pixelPerfect</h1>
    <span id="status" class="status">Not configured</span>
  </header>

  <details id="settings">
    <summary>Settings</summary>
    <label>Meta API key <input id="apiKey" type="password" autocomplete="off"></label>
    <label>Model <input id="model" value="muse-spark-1.1"></label>
    <label>API base URL <input id="baseUrl" value="https://api.meta.ai/v1"></label>
    <div class="row">
      <button id="save">Save</button>
      <button id="test" class="secondary">Test connection</button>
    </div>
  </details>

  <section class="pick">
    <button id="pick">Pick elements</button>
    <p class="hint">Click to select · Shift+click to add more · ↑ while hovering selects the parent block · Esc to stop</p>
    <ol id="selection" class="selection" hidden></ol>
  </section>

  <section class="ask">
    <textarea id="goal" rows="3" placeholder="What's wrong? e.g. &quot;this button should be centered in the card&quot;"></textarea>
    <button id="run" disabled>Fix it</button>
  </section>

  <section id="review" class="review" hidden>
    <h2>Review the changes</h2>
    <div class="row">
      <button id="toggleView" class="secondary" aria-pressed="false">Show original</button>
      <button id="discard" class="secondary danger">Discard changes</button>
    </div>
    <button id="sendCode" disabled title="Coming with the bridge">Apply to code (coming soon)</button>
  </section>

  <section>
    <h2>Agent trace</h2>
    <ol id="trace" class="trace"></ol>
  </section>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
